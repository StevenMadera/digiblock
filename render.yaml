services:
  - type: web
    name: digiblock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: APP_ENV
        value: produccion
      - key: ADMIN_USER
        value: universidad
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false